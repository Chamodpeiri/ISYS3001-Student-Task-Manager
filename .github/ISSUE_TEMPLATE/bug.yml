name: Bug report
description: Record a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true

